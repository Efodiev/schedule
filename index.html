<style>

t-weight:750;font-size:14px}.daydate{color:var(--muted);font-size:12px;margin-top:3px}.todaymark{font-size:9px;color:var(--blue);font-weight:800;letter-spacing:.04em;margin-left:5px}.lesson{background:#fff;border:1px solid #e9eff7;border-radius:11px;padding:12px 11px;margin-bottom:9px;box-shadow:0 2px 7px #243d5c04}.lesson:last-child{margin-bottom:0}.time{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}.time strong{font-size:12px}.time span{font-size:10px;color:var(--muted)}.subject{font-size:12px;font-weight:650;line-height:1.5}.teacher{font-size:11px;color:var(--muted);margin-top:6px}.lessonfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}.remote{display:inline-flex;align-items:center;gap:5px;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:6px 10px;font-size:10px;font-weight:700;text-decoration:none;transition:background .15s,transform .15s}.remote:hover{background:#d9e8ff;transform:translateY(-1px)}.remote.disabled{background:#f1f4f8;color:#7a8ba5;cursor:default.weektype{font-size:9px;font-weight:750;border-radius:6px;padding:3px 6px}.weektype.odd{background:var(--amber-soft);color:var(--amber)}.weektype.even{background:var(--blue-soft);color:#315ec1}.empty{padding:20px 6px;color:#9aa8bb;font-size:12px;text-align:center}.mobile-select{display:none}.footer{margin-top:20px;text-align:center;font-size:11px;color:#a0acbd}

<body><main class="wrap">
<header class="heading"><div class="logo"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="30" height="27" rx="5"/><path d="M12 4v8M28 4v8M5 16h30"/></svg></div><div><h1>Расписание занятий</h1><p class="sub">Группа <strong>ФГ26ВР75РСГМП</strong> <span style="padding:0 7px">·</span> 1 семестр, 2026–2027 уч. г.</p></div></header>
<section class="weekbar" aria-label="Выбор недели"><button class="navbtn" id="prev" aria-label="Предыдущая неделя">‹</button><div class="weekmeta"><strong id="weekrange">—</strong><span id="weekcaption">Текущая неделя</span></div><button class="navbtn" id="next" aria-label="Следующая неделя">›</button><div class="weekright"><span id="parity" class="parity odd">Нечётная неделя</span><button class="current" id="today">Сегодня ↗</button></div></section>

</main>
<script>
const weekdays=['Понедельник','Вторник','Среда','Четверг','Пятница'],shortdays=['ПН','ВТ','СР','ЧТ','ПТ'],months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
// ССЫЛКИ ДЛЯ ОНЛАЙН-ПОДКЛЮЧЕНИЯ
// Чтобы изменить ссылку преподавателя, отредактируйте URL справа.
// Если ссылки нет, укажите пустую строку: ''.
const TEACHER_LINKS = {
  'доц. С.Г. Кучеряну': 'https://meet.google.com/qak-fbch-nbq',
  'ст. пр. В.И. Медведев': '',
  'доц. А.Н. Оставная': '',
  'доц. А.М. Чобан-Пилецкая': '',
  'пр. И.Е. Луцкова': ''
};

const lessons=[
{d:0,p:6,t:'16:30–18:00',s:'Введение в профессиональную деятельность',k:'Лекция / практика',teacher:'ст. пр. В.И. Медведев'},
{d:0,p:7,t:'18:10–19:40',s:'Система государственного и муниципального управления',k:'Лекция',teacher:'ст. пр. В.И. Медведев'},
{d:0,p:8,t:'19:50–21:20',s:'Система государственного и муниципального управления',k:'Практика',teacher:'ст. пр. В.И. Медведев'},
{d:1,p:7,t:'18:10–19:40',s:'Психологические основы работы с молодёжью и психология общения',k:'Лекция',teacher:'доц. С.Г. Кучеряну'},
{d:1,p:8,t:'19:50–21:20',s:'Психологические основы работы с молодёжью и психология общения',k:'Практика',teacher:'доц. С.Г. Кучеряну'},
{d:2,p:7,t:'18:10–19:40',s:'Государственная социальная политика',k:'Лекция',teacher:'доц. А.Н. Оставная'},
{d:2,p:8,t:'19:50–21:20',s:'Государственная социальная политика',k:'Практика',teacher:'доц. А.Н. Оставная'},
{d:3,p:6,t:'16:30–18:00',s:'Система государственного и муниципального управления',k:'Лекция',teacher:'ст. пр. В.И. Медведев',parity:'odd'},
{d:3,p:6,t:'16:30–18:00',s:'Государственная социальная политика',k:'Лекция',teacher:'доц. А.Н. Оставная',parity:'even'},
{d:3,p:7,t:'18:10–19:40',s:'Педагогические основы работы с молодёжью',k:'Лекция',teacher:'доц. А.М. Чобан-Пилецкая'},
{d:3,p:8,t:'19:50–21:20',s:'Педагогические основы работы с молодёжью',k:'Практика',teacher:'доц. А.М. Чобан-Пилецкая'},
{d:4,p:7,t:'18:10–19:40',s:'Деловые коммуникации в профессиональной среде',k:'Лекция / практика',teacher:'пр. И.Е. Луцкова'},
{d:4,p:8,t:'19:50–21:20',s:'Психологические основы работы с молодёжью и психология общения',k:'Лекция',teacher:'доц. С.Г. Кучеряну',parity:'odd'}];
const ranges=[['2026-09-01','2026-09-06','odd'],['2026-09-07','2026-09-13','even'],['2026-09-14','2026-09-20','odd'],['2026-09-21','2026-09-27','even'],['2026-09-28','2026-10-04','odd'],['2026-10-05','2026-10-11','even'],['2026-10-12','2026-10-18','odd'],['2026-10-19','2026-10-25','even'],['2026-10-26','2026-11-01','odd'],['2026-11-02','2026-11-08','even'],['2026-11-09','2026-11-15','odd'],['2026-11-16','2026-11-22','even'],['2026-11-23','2026-11-29','odd'],['2026-11-30','2026-12-06','even'],['2026-12-07','2026-12-13','odd'],['2026-12-14','2026-12-20','even'],['2026-12-21','2026-12-27','odd'],['2026-12-28','2027-01-03','even'],['2027-01-04','2027-01-10','odd'],['2027-01-11','2027-01-17','even'],['2027-01-18','2027-01-24','odd'],['2027-01-25','2027-01-31','even'],['2027-02-01','2027-02-07','odd'],['2027-02-08','2027-02-14','even'],['2027-02-15','2027-02-21','odd'],['2027-02-22','2027-02-28','even'],['2027-03-01','2027-03-07','odd'],['2027-03-08','2027-03-14','even'],['2027-03-15','2027-03-21','odd'],['2027-03-22','2027-03-28','even'],['2027-03-29','2027-04-04','odd'],['2027-04-05','2027-04-11','even'],['2027-04-12','2027-04-18','odd'],['2027-04-19','2027-04-25','even'],['2027-04-26','2027-05-02','odd'],['2027-05-03','2027-05-09','even'],['2027-05-10','2027-05-16','odd'],['2027-05-17','2027-05-23','even'],['2027-05-24','2027-05-30','odd'],['2027-05-31','2027-06-06','even'],['2027-06-07','2027-06-13','odd'],['2027-06-14','2027-06-20','even'],['2027-06-21','2027-06-27','odd'],['2027-06-28','2027-07-04','even']];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const monday=d=>{let x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};const same=(a,b)=>iso(a)===iso(b);const fmt=d=>`${d.getDate()} ${months[d.getMonth()]}`;const weekFmt=(a,b)=>`${a.getDate()}–${b.getDate()} ${months[b.getMonth()]} ${b.getFullYear()}`;
function parity(d){let key=iso(d),r=ranges.find(x=>key>=x[0]&&key<=x[1]);if(r)return r[2];let base=monday(new Date(2026,9,12)),delta=Math.round((monday(d)-base)/604800000);return ((delta%2+2)%2===0)?'odd':'even'}
let start=monday(new Date()),selected=new Date();selected.setHours(12,0,0,0);
function render(){const now=new Date();now.setHours(12,0,0,0);let end=add(start,4),par=parity(start);document.getElementById('weekrange').textContent=weekFmt(start,end);document.getElementById('weekcaption').textContent=same(start,monday(now))?'Текущая неделя':'Выбранная неделя';let pill=document.getElementById('parity');pill.className='parity '+par;pill.textContent=par==='odd'?'Нечётная неделя':'Чётная неделя';if(selected<start||selected>end)selected=new Date(start);
const days=document.getElementById('days'),mobile=document.getElementById('mobileSelect');days.innerHTML='';mobile.innerHTML='';for(let i=0;i<5;i++){let date=add(start,i),isToday=same(date,now),isActive=same(date,selected),items=lessons.filter(l=>l.d===i&&(!l.parity||l.parity===par));let b=document.createElement('button');b.innerHTML=`${shortdays[i]}<span>${String(date.getDate()).padStart(2,'0')}</span>`;b.className=(isActive?'active ':'')+(isToday?'today':'');b.onclick=()=>{selected=new Date(date);render()};mobile.appendChild(b);let col=document.createElement('article');col.className='day'+(isToday?' today':'')+(isActive?' mobile-active':'');let cards=items.map(l=>{const url=TEACHER_LINKS[l.teacher]||'';const join=url?`<a class="remote" href="${url}" target="_blank" rel="noopener noreferrer">↗ Подключиться онлайн</a>`:`<span class="remote disabled" title="Добавьте ссылку в TEACHER_LINKS в начале скрипта">Онлайн-ссылка не добавлена</span>`;return `<div class="lesson"><div class="time"><strong>${l.p} пара</strong><span>${l.t}</span></div>${l.parity?`<span class="weektype ${l.parity}">${l.parity==='odd'?'Нечётные':'Чётные'}</span>`:''}<div class="subject">${l.s} (${l.k.toLowerCase()})</div><div class="teacher">${l.teacher}</div><div class="lessonfoot">${join}</div></div>`}).join('');col.innerHTML=`<div class="dayhead"><div class="dayname">${weekdays[i]}${isToday?'<span class="todaymark">СЕГОДНЯ</span>':''}</div><div class="daydate">${fmt(date)}</div></div>${cards||'<div class="empty">Нет занятий</div>'}`;days.appendChild(col)} }
function shift(n){start=add(start,n*7);selected=new Date(start);render()}document.getElementById('prev').onclick=()=>shift(-1);document.getElementById('next').onclick=()=>shift(1);document.getElementById('today').onclick=()=>{start=monday(new Date());selected=new Date();selected.setHours(12,0,0,0);render()};render();
</script></body></html>
